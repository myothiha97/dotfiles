# ==========================
# ===  General Settings  ===
# ==========================

# Fix line-break 'jj' bugs when pasting into Claude Code / TUIs
set -g set-clipboard on
# note: the above config does not fix -  Fix line-break 'jj' bugs when pasting into Claude Code / TUIs

set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# Extended keys for proper modifier key support in neovim
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'tmux-256color:extkeys'

# Cursor style (blinking block)
set -g cursor-style blinking-block
# set -ga terminal-features ',ghostty:Se:Ss'
# set -ga terminal-features ',xterm-ghostty:Se:Ss'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

set -g history-limit 50000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
set -g focus-events on

# Start indexing at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Mouse support
set -g mouse on

# ==========================
# ===    Key Bindings    ===
# ==========================

# Change prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes (keep current path)
bind v split-window -h -c "#{pane_current_path}"
bind e split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Ctrl+hjkl (repeatable)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Window navigation
bind -r n next-window
bind -r p previous-window
bind Tab last-window

# Create new window (keep current path)
bind c new-window -c "#{pane_current_path}"

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window
bind Q kill-session

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# ==========================
# ===    Copy Mode (Vi)  ===
# ==========================

setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Keep scroll position after mouse-drag selection (don't snap to bottom)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# ==========================
# ===  Session Switching ===
# ==========================
# Sessions are numbered by creation time, oldest first, by tmux/list-sessions.sh.
# All three bindings below share it so the picker and the shortcuts always agree.

# Two session pickers, same panel, opposite keyboard trade-offs. A key is
# either typed into a search field or acts as a command, never both.
#
#   prefix + f   no input field: j/k, ctrl-n/ctrl-p, arrows and digits 1-9
#                navigate or jump straight to a session. No search.
#   prefix + s   input field: everything types, including j/k and digits;
#                ctrl-n/ctrl-p and the arrows move.
#
# choose-tree is not used because its row keys start at 0 and are not
# configurable, and display-menu hardcodes its navigation keys (no ctrl-n /
# ctrl-p), which is why these are fzf in a popup. Tree stays on prefix + S.
bind f display-popup -E -w 36 -h 10 -T " sessions " "~/.dotfiles/tmux/session-picker.sh select"
bind s display-popup -E -w 44 -h 12 -T " search sessions " "~/.dotfiles/tmux/session-picker.sh search"
bind S choose-tree -Zs

# Cycle sessions: prefix + Cmd + n / p (arrives as M-n / M-p, see ghostty/config).
# Overrides tmux's default prefix M-n / M-p (next/previous-window -a).
bind M-n run-shell -b "~/.dotfiles/tmux/cycle-session.sh next '#{client_tty}'"
bind M-p run-shell -b "~/.dotfiles/tmux/cycle-session.sh prev '#{client_tty}'"

# Jump by position: prefix + Cmd + <number>.
# These read as C-<n> because tmux has no Super/Cmd modifier; ghostty/config maps
# Cmd+<n> to the Ctrl+<n> extended-key sequence, so the key pressed is Cmd while
# the key tmux matches is Ctrl. Alt+<number> is unavailable because
# ghostty/config sets macos-option-as-alt = false.
bind C-1 run-shell -b "~/.dotfiles/tmux/switch-session.sh 1 '#{client_tty}'"
bind C-2 run-shell -b "~/.dotfiles/tmux/switch-session.sh 2 '#{client_tty}'"
bind C-3 run-shell -b "~/.dotfiles/tmux/switch-session.sh 3 '#{client_tty}'"
bind C-4 run-shell -b "~/.dotfiles/tmux/switch-session.sh 4 '#{client_tty}'"
bind C-5 run-shell -b "~/.dotfiles/tmux/switch-session.sh 5 '#{client_tty}'"
bind C-6 run-shell -b "~/.dotfiles/tmux/switch-session.sh 6 '#{client_tty}'"
bind C-7 run-shell -b "~/.dotfiles/tmux/switch-session.sh 7 '#{client_tty}'"
bind C-8 run-shell -b "~/.dotfiles/tmux/switch-session.sh 8 '#{client_tty}'"
bind C-9 run-shell -b "~/.dotfiles/tmux/switch-session.sh 9 '#{client_tty}'"

# ==========================
# ===   Status Bar       ===
# ==========================

set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# bg=default everywhere keeps ghostty's background-opacity/blur showing through.
# A hardcoded colour here would paint an opaque strip over it.
set -g status-style "bg=default,fg=#c0caf5"

# Session name as plain text, no pill or separator.
set -g status-left "#[fg=#7aa2f7,bold] #S  "
set -g status-left-length 40

set -g status-right "#[fg=#565f89]%H:%M  %d-%b "
set -g status-right-length 50


set -g default-terminal "tmux-256color"
# Window status: "<index>:<name>", current one in the accent colour.
setw -g window-status-format "#[fg=#565f89,bg=default] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bg=default,bold] #I:#W "

# Separator left empty: each label already carries a leading and trailing
# space, so windows sit 2 apart on their own. That matches tmux's own default
# spacing, which is a 1-space separator plus the 1-char window-flag slot.
setw -g window-status-separator ""

# Pane borders (subtle)
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Message styling
set -g message-style "bg=#1a1b26,fg=#7aa2f7"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Persist sessions across reboot (continuum auto-saves + auto-restores)
set -g @continuum-restore 'on'       # restore last save automatically when tmux starts
set -g @continuum-save-interval '15' # auto-save every 15 minutes

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


