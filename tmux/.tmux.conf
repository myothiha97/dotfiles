# ==========================
# ===  General Settings  ===
# ==========================

set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# Extended keys for proper modifier key support in neovim
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'tmux-256color:extkeys'

# Cursor style (blinking block)
set -g cursor-style blinking-block
# set -ga terminal-features ',ghostty:Se:Ss'
# set -ga terminal-features ',xterm-ghostty:Se:Ss'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

set -g history-limit 50000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
set -g focus-events on

# Start indexing at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Mouse support
set -g mouse on

# ==========================
# ===    Key Bindings    ===
# ==========================

# Change prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind e split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Ctrl+hjkl (repeatable)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Window navigation
bind -r n next-window
bind -r p previous-window
bind Tab last-window

# Create new window (keep current path)
bind c new-window -c "#{pane_current_path}"

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window
bind Q kill-session

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# ==========================
# ===    Copy Mode (Vi)  ===
# ==========================

setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ==========================
# ===   Status Bar       ===
# ==========================

set -g status-position bottom
set -g status-interval 5

# Minimal status bar styling (tokyonight-ish)
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "#[fg=#7aa2f7,bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=#565f89]%H:%M #[fg=#7aa2f7]%d-%b"
set -g status-right-length 50


set -g default-terminal "tmux-256color"
# Window status
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "

# Pane borders (subtle)
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Message styling
set -g message-style "bg=#1a1b26,fg=#7aa2f7"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


