# Yazi file manager. Defaults are already vim-like, so this file only adjusts
# layout, sorting and openers. Key changes live in keymap.toml.

[mgr]
# Parent : current : preview column widths. The parent column is hidden (0) and
# its space goes to the file list and the preview, which gets the larger share
# so images render big.
ratio = [0, 2, 3]
sort_by = "natural"
sort_dir_first = true
sort_sensitive = false
show_hidden = false
show_symlink = true
# Keep this many rows visible above and below the cursor, like vim's scrolloff
scrolloff = 5
linemode = "size"

[preview]
wrap = "yes"
# Pixel cap yazi downscales images to before drawing. Low values look blurry on
# a retina screen, so this is generous.
max_width = 2400
max_height = 1800

[opener]
# Typora renders Mermaid diagrams, tables, images and code far better than an
# editor, and markdown here is mostly read, not written.
markdown = [{ run = "open -a Typora %s", orphan = true, desc = "Typora" }]

[open]
# Added in front of yazi's own rules, so other file types are unchanged. `edit`
# stays as the second choice in "open with" (O).
prepend_rules = [{ url = "*.md", use = ["markdown", "edit"] }]
