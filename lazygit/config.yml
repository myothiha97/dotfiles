git:
  # Use git's natural commit order instead of the default `topo-order`.
  # topo-order forces a full topological sort of all reachable history before
  # the graph can render — on large repos (many branches / deep history) that
  # is a 1-2s freeze on startup. `default` streams commits cheaply with no
  # global sort pass. Harmless on small repos, big win on large ones.
  log:
    order: default
  # delta for SYNTAX COLOURS ONLY (re-enabled 2026-10-16). The text is kept
  # line-for-line identical to plain git diff (raw headers, +/- markers, real
  # tabs, no truncation), verified by stripping colours and diffing. Only the
  # diff panel uses it; the staging view and merge resolver are drawn by
  # lazygit itself. Cost: ~30 ms per normal diff, ~140 ms for 4k lines.
  #
  # It was disabled 2026-06-29 as "unstable", cause never recorded. The likely
  # suspect is delta asking the terminal for its background colour, so --dark
  # pins it and skips that query; --no-gitconfig keeps outside delta settings
  # out. Theme: TwoDark (Atom One Dark port), built in, no bat cache needed.
  # Backgrounds are GitHub dark's add/remove tints. Undo: delete `pagers`.
  pagers:
    - colorArg: always
      pager: >-
        delta --no-gitconfig --dark --paging=never --tabs=0
        --syntax-theme=TwoDark --keep-plus-minus-markers
        --file-style=raw --file-decoration-style=none
        --hunk-header-style=raw --hunk-header-decoration-style=none
        --max-line-length=0
        --plus-style='syntax #12261e' --plus-emph-style='syntax #12261e'
        --minus-style='syntax #25171c' --minus-emph-style='syntax #25171c'
gui:
  # Lazygit cannot truly hide the Commits/Stash panels by default in 0.62.2,
  # so bias the layout toward the currently focused area instead.
  # screen mode normal, half, full
  screenMode: normal
  sidePanelWidth: 0.3
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 3
  showCommandLog: false
